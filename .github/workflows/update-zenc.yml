name: Update Zen C

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-zenc
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update formula from the latest GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_zenc.py
      - name: Verify changed formula
        id: changed
        run: |
          if git diff --quiet -- Formula/zenc.rb; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            brew tap cdenihan/tap "$GITHUB_WORKSPACE"
            cp Formula/zenc.rb "$(brew --repository cdenihan/tap)/Formula/zenc.rb"
            brew audit --strict cdenihan/tap/zenc
            brew install cdenihan/tap/zenc
            brew test cdenihan/tap/zenc
          fi
      - name: Commit update
        if: steps.changed.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/zenc.rb
          git commit -m "Update Zen C formula"
          git push
